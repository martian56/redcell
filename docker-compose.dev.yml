# Dev infrastructure only. The API and worker run locally via `uv run` for hot
# reload. Buckets are created by `rc seed` (in code), not here.
services:
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: redcell
      POSTGRES_PASSWORD: redcell
      POSTGRES_DB: redcell
    ports: ['5432:5432']
    volumes: ['redcell_pg:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U redcell']
      interval: 5s
      timeout: 3s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:3.97
    command: server -s3 -s3.config=/etc/seaweed/s3.json -dir=/data
    ports: ['8333:8333']
    volumes:
      - redcell_seaweed:/data
      - ./docker/seaweedfs/s3.dev.json:/etc/seaweed/s3.json:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redcell_pg: {}
  redcell_seaweed: {}
