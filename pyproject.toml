# uv workspace root for the Python backend.
#
# The JS side (apps/web, packages/*) is managed by bun workspaces in
# package.json. This is the parallel virtual root for Python: it declares
# members but is not itself a package, so uv keeps one shared .venv and one
# uv.lock across every Python member.
[tool.uv.workspace]
members = ["packages/core", "apps/api", "apps/worker"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["apps/api", "apps/worker"]
testpaths = ["packages/core/tests", "apps/api/tests", "apps/worker/tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
# Alembic migration scripts are generated; leave them as written.
extend-exclude = ["packages/core/redcell_core/alembic/versions"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import sorting, UP pyupgrade, B bugbear.
select = ["E", "F", "I", "W", "UP", "B"]
# E501: the code favors compact, longer lines, so line length is not enforced.
# B008: FastAPI reads Depends()/Query() from argument defaults by design.
ignore = ["E501", "B008"]
