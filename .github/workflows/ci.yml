name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff + eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Ruff (Python)
        run: uvx ruff@0.15.8 check .

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: ESLint (frontend)
        run: bun run lint

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start infrastructure (Postgres, Redis, MinIO)
        run: docker compose -f docker-compose.dev.yml up -d

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group live

      - name: Wait for infrastructure
        run: |
          for i in $(seq 1 60); do
            if docker compose -f docker-compose.dev.yml exec -T postgres pg_isready -U redcell -q \
              && docker compose -f docker-compose.dev.yml exec -T redis redis-cli ping | grep -q PONG \
              && curl -fsS http://localhost:9000/minio/health/ready >/dev/null; then
              echo "infrastructure ready"
              exit 0
            fi
            echo "waiting for infrastructure ($i/60)..."
            sleep 2
          done
          echo "infrastructure did not become ready"
          docker compose -f docker-compose.dev.yml ps
          exit 1

      - name: Run tests
        run: uv run pytest -q

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build
