name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            file: docker/api/Dockerfile
            context: .
            version_file: apps/api/pyproject.toml
          - app: worker
            file: docker/worker/Dockerfile
            context: .
            version_file: apps/worker/pyproject.toml
          - app: web
            file: docker/web/Dockerfile
            context: .
            version_file: apps/web/package.json
          - app: kali
            file: docker/kali/Dockerfile
            context: docker/kali
            version_file: docker/kali/VERSION
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: v
        run: |
          case "${{ matrix.app }}" in
            web) ver=$(jq -r .version "${{ matrix.version_file }}") ;;
            kali) ver=$(tr -d '[:space:]' < "${{ matrix.version_file }}") ;;
            *) ver=$(grep -m1 -E '^version' "${{ matrix.version_file }}" | sed -E 's/.*"([^"]+)".*/\1/') ;;
          esac
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$owner/redcell-${{ matrix.app }}" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already on GHCR
        id: gate
        run: |
          if docker manifest inspect "${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }} already published, skipping"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Free disk space
        if: steps.gate.outputs.publish == 'true' && matrix.app == 'kali'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          large-packages: true

      - name: Set up Buildx
        if: steps.gate.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: steps.gate.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.image }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  release:
    needs: images
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assemble image table
        id: notes
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          api=$(grep -m1 -E '^version' apps/api/pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')
          worker=$(grep -m1 -E '^version' apps/worker/pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')
          web=$(jq -r .version apps/web/package.json)
          kali=$(tr -d '[:space:]' < docker/kali/VERSION)
          {
            echo "body<<EOF"
            echo "Container images on GHCR (only versions not already published were pushed this release):"
            echo ""
            echo "| App | Image | Version |"
            echo "| --- | --- | --- |"
            echo "| API | \`ghcr.io/$owner/redcell-api\` | $api |"
            echo "| Worker | \`ghcr.io/$owner/redcell-worker\` | $worker |"
            echo "| Web | \`ghcr.io/$owner/redcell-web\` | $web |"
            echo "| Kali | \`ghcr.io/$owner/redcell-kali\` | $kali |"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: ${{ steps.notes.outputs.body }}
